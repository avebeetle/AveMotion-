name: samsung-comparison

on:
  workflow_dispatch:

jobs:
  linux-reference:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset:
          - linux-clang-samsung-debug
          - linux-gcc-samsung-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify both vendored sources and corpus
        run: python3 scripts/verify_vendor.py --variant all
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  linux-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/verify_vendor.py --variant all
      - run: cmake --preset linux-clang-samsung-asan
      - run: cmake --build --preset linux-clang-samsung-asan --parallel 2
      - run: ctest --preset linux-clang-samsung-asan

  windows-reference:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Verify both vendored sources and corpus
        run: python scripts/verify_vendor.py --variant all
      - name: Configure
        run: cmake --preset windows-msvc-samsung-debug
      - name: Build
        run: cmake --build --preset windows-msvc-samsung-debug --parallel 2
      - name: Test
        run: ctest --preset windows-msvc-samsung-debug
      - name: Upload Direct2D diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct2d-windows-msvc-samsung-debug
          if-no-files-found: warn
          path: |
            out/build/windows-msvc-samsung-debug/direct2d-artifacts/**
            out/build/windows-msvc-samsung-debug/Testing/Temporary/LastTest.log
